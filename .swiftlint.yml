# SwiftLint for what swift-format does not check (library plan #2, mmn-n93): crashes waiting to happen. Style is
# swift-format's (.swift-format, `just fmt`), so no style rules here. The app code only: a `!` in a test fails the
# test, which is what it is for.
only_rules:
  - force_unwrapping
  - force_cast
  - force_try
force_unwrapping:
  severity: error
included:
  - Sources
  - Package.swift
